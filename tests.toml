#:schema https://raw.githubusercontent.com/YunoHost/apps/main/schemas/tests.v1.schema.json

test_format = 1.0

[default]
    # OAuth callback is hardcoded at <domain>/callback; install refuses
    # sub-paths, so the subdir scenario cannot run.
    exclude = ["install.subdir"]

    # Dummy OAuth credentials: CI only checks install + service health;
    # real GitHub OAuth only matters for interactive logins.
    args.site_hosts = "cms.example.org"
    args.github_client_id = "Iv1.0123456789abcdef"
    args.github_client_secret = "0123456789abcdef0123456789abcdef01234567"
