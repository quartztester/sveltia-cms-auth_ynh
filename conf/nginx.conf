# Root-install only (enforced in scripts/install): the OAuth callback is
# always <domain>/callback, so no path juggling here.
# Upstream only implements /auth and /callback — the bare root 404s, so
# serve a landing page from nginx directly.
location = __PATH__ {
    default_type text/html;
    return 200 '<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Sveltia CMS Auth</title></head><body style="font-family:system-ui;max-width:40rem;margin:4rem auto;"><h1>Sveltia CMS Auth</h1><p>This is the OAuth endpoint for a Sveltia CMS instance.</p><p>Point your CMS <code>auth_endpoint</code> at <code>/auth</code>; GitHub sends users back to <code>/callback</code>.</p></body></html>';
}

location __PATH__/ {
    proxy_pass http://127.0.0.1:__PORT__;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
